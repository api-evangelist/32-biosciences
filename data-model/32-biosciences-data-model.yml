relationship_discovery:
  hal_links: true
  detail: >-
    Every object carries a `_links` block with self, collection, about, author, replies,
    wp:featuredmedia, wp:attachment and wp:term relations, so the graph above is also traversable at
    runtime without this document. `?_embed=true` inlines the linked objects.
notes:
- >-
  This is a CMS content model, not a scientific one. Nothing in 32 Biosciences' diagnostic or
  therapeutic platform - metabolomic signatures, pipeline assets, clinical data - is exposed
  programmatically anywhere on this surface.
