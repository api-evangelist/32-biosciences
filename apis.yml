x-pointers-deliberately-omitted:
  note: >-
    Recorded so a later pass does not read these as gaps this run missed. Each was probed or
    derived and the underlying thing is genuinely absent, so emitting the pointer would be a false
    claim made on 32 Biosciences' behalf.
  omitted:
  - type: WellKnown
    reason: >-
      Every /.well-known/ path on both hosts returns HTTP 404 with the site's HTML 404 template.
      The probe is recorded in well-known/32-biosciences-well-known.yml; the pointer is not.
  - type: SecurityTxt
    reason: https://32biosciences.com/.well-known/security.txt returns HTTP 404.
  - type: AgentCard
    reason: >-
      /.well-known/agent-card.json and /.well-known/agent.json both return HTTP 404. Never derived.
      No a2a/ artifact was written.
  - type: MCPServer
    reason: >-
      No MCP server exists. mcp/32-biosciences-mcp.yml carries deployment.mode none and a candidate
      tool list, so it is pointed at with X-MCPServerCandidate instead.
  - type: SDKs
    reason: >-
      npm, PyPI and GitHub searches all returned zero first-party packages;
      packages/32-biosciences-packages.yml records package_count 0.
  - type: Idempotency
    reason: >-
      conventions idempotency.coverage is none - no Idempotency-Key header is accepted, documented
      or observed anywhere on the surface.
  - type: StatusPage
    reason: No status page. status.32biosciences.com does not resolve.
  - type: Deprecation
    reason: No deprecation policy, and no Sunset or Deprecation headers on any observed response.
  - type: Security
    reason: >-
      probe-security-programs.py found no vulnerability-disclosure policy, no bug bounty and no
      security contact.
  - type: Compliance
    reason: No certification, audit report or trust center is published.
  - type: ChangeLog
    reason: >-
      No dated changelog exists. The newsroom is corporate press and is wired as Blog/News.
  - type: Pricing
    reason: >-
      No pricing page anywhere in the 37-page site inventory; plans plan_count is 0.
  - type: TermsOfService
    reason: >-
      No terms page is published. /terms-of-use/ returns HTTP 404; only privacy, cookie,
      accessibility and conflict-of-interest policies exist.
  - type: GitHubOrganization
    reason: https://github.com/32biosciences returns HTTP 404 and GitHub search finds no org.
  - types: [DeveloperPortal, Documentation, APIReference, GettingStarted, Sandbox, CLI, Postman, Roadmap,
      SignUp, AsyncAPI, Webhooks]
    reason: >-
      None of these exist. 32 Biosciences runs no developer program: there is no portal, no
      documentation, no reference, no console, no CLI, no public Postman collection, no roadmap, no
      developer sign-up and no event or webhook surface of any kind.
