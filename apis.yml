aid: 32-biosciences
name: 32 Biosciences
description: 32 Biosciences (pronounced "Three Squared") is a North Chicago, Illinois gastrointestinal biotechnology
  company founded in 2023 that pioneers gut mucosal-immune science to prevent and treat GI disease. It emerged
  from stealth in September 2024 and is built on research by scientific co-founders John Alverdy MD and Eugene
  Chang MD of the University of Chicago and Joseph Pierre PhD of the University of Wisconsin-Madison, with Peter
  Farmakis as CEO. The company runs two platforms - a GI Discovery Platform that measures metabolomic signatures
  of gut mucosal-immune function for therapeutic discovery and clinical decision-making, and a CS Therapeutic Platform
  whose lead asset CS-0003 is a Mucosal Immune Modulator intended to restore and protect the GI mucosal-immune
  barrier across seven indications. It raised $6 million in early funding and announced a $40 million Series A
  launch at the 2026 J.P. Morgan Healthcare Conference. 32 Biosciences publishes no product or developer API and
  runs no developer program; the only machine-readable surface on 32biosciences.com is the WordPress REST API (wp/v2)
  that serves the company newsroom, marketing and platform pages, leadership profiles, taxonomies and media library
  as JSON, alongside a WordPress Abilities registry that is present but authentication-gated.
